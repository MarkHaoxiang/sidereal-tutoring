name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Bare, so pyproject.toml's `files` decides the target set; naming packages here
      # would quietly narrow the check.
      - run: uv run mypy

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # The rust job below already runs cargo test --workspace with a cache; skip the
      # cargo section here so this job doesn't also fetch the pinned toolchain and
      # rebuild the whole Rust workspace uncached on every push.
      - run: ./run_tests.sh
        env:
          SIDEREAL_SKIP_RUST: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sidereal-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/sidereal-app/frontend/package-lock.json
      # `npm run gen-api` shells into `uv run python -m sidereal_app.api.openapi`, so the
      # drift check below needs the Python workspace installed as well as node. It builds
      # the schema from the app object, so nothing has to be running.
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The generated client is committed, so a route change that nobody regenerated for
      # shows up as a diff here rather than as a type error months later.
      - run: npm run gen-api
      - run: git diff --exit-code -- openapi.json src/lib/api-schema.d.ts

  extensions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: directus/extensions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: directus/extensions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain action here on purpose: rust-toolchain.toml pins the channel and its
      # rustfmt/clippy components, and rustup (preinstalled on ubuntu-latest) reads it
      # automatically on the first cargo invocation. Hardcoding a toolchain here would let
      # CI silently drift from that pin.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  directus-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships the compose plugin, so `docker compose` needs no setup step.
      # docker-compose.yml declares .env as required, and every value in it is a dev
      # placeholder, so the example file is exactly what CI should use.
      - run: cp .env.example .env
      # directus/extensions is bind-mounted, so an unbuilt extension makes the loader throw on
      # every CLI invocation and buries real errors. Building it here also proves it loads on
      # the pinned Directus, which the directus-extensions job cannot show.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: directus/extensions/package-lock.json
      - run: npm ci
        working-directory: directus/extensions
      - run: npm run build
        working-directory: directus/extensions
      # No LICENSE_KEY is set here: CI deliberately runs Directus on the Core tier, so the
      # grant's finite activations are never spent on a throwaway runner.
      - run: docker compose up -d --wait
      - run: |
          docker compose logs --no-color directus | grep -q "Loaded extensions: sidereal-audit"
      - run: ./scripts/directus-schema-apply.sh
      # Round-trip: the committed snapshot, applied to a fresh Directus and snapshotted
      # back, must come back byte-identical. A hand-edit that Directus would normalise
      # differently fails here.
      - run: ./scripts/directus-schema-snapshot.sh "$RUNNER_TEMP/snapshot.yaml"
      - run: diff -u directus/schema/snapshot.yaml "$RUNNER_TEMP/snapshot.yaml"
      - if: failure()
        run: docker compose logs --no-color directus
