[package]
name = "sidereal-transcripts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Worker that will turn uploaded audio/video into transcript documents"

[[bin]]
name = "sidereal-transcripts"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sidereal-common = { workspace = true }
sidereal-directus = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
wiremock = { workspace = true }
